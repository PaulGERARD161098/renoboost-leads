[project]
name = "renoboost-leads"
version = "0.5.0"
description = "Outil de prospection B2B paramétrable — extraction Google Places + enrichissement entreprises (data.gouv.fr) + scraping contacts + scoring Claude"
authors = [{name = "Paul - RénoBoost", email = "paul@renoboost.fr"}]
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "tenacity>=8.2.3",
    "pandas>=2.1.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "anthropic>=0.39.0",
    "jinja2>=3.1.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
ui = [
    "streamlit>=1.30.0",
]

[project.scripts]
renoboost-leads = "renoboost_leads.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
