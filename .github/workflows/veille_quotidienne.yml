name: Veille quotidienne (immatriculations VE flotte)

# Cron : chaque matin du lundi au vendredi à 07:30 UTC (08:30 Paris hiver, 09:30 été)
# Adapter à ton créneau souhaité.
on:
  schedule:
    - cron: "30 7 * * 1-5"
  workflow_dispatch:        # déclenchement manuel via GitHub UI
    inputs:
      fichier_aaa:
        description: "Chemin du CSV AAA dans le repo (relatif à la racine)"
        required: true
        default: "data/veille_inbox/aaa_jour.csv"
      dry_run:
        description: "Mode dry-run (pas d'appel Anthropic)"
        type: boolean
        default: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"

      - name: Vérification fichier d'entrée
        env:
          FICHIER: ${{ github.event.inputs.fichier_aaa || 'data/veille_inbox/aaa_jour.csv' }}
        run: |
          if [ ! -f "$FICHIER" ]; then
            echo "::warning::Fichier $FICHIER absent — workflow s'arrête sans erreur."
            echo "skip=true" >> $GITHUB_ENV
          fi

      - name: Lancer la veille
        if: env.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_DESTINATAIRES: ${{ secrets.SMTP_DESTINATAIRES }}
          FICHIER: ${{ github.event.inputs.fichier_aaa || 'data/veille_inbox/aaa_jour.csv' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS="--fichier $FICHIER"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m renoboost_leads.cli veille run $ARGS

      - name: Upload artefacts veille
        if: env.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_id }}
          path: |
            data/veille/**/veille_leads.csv
            data/veille/**/session.log
            data/veille/**/stats_run.json
          retention-days: 30
