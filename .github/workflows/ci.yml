name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,storage]"

      - name: Lint with ruff (src + tests + app.py)
        run: ruff check src/ tests/ app.py

      - name: Smoke check Streamlit app
        run: python -c "import ast; ast.parse(open('app.py').read())"

      - name: Run tests
        run: pytest tests/ -v --cov=src/renoboost_leads --cov-report=term-missing
