# ════════════════════════════════════════════════════════════════
# VERTICALE — Bornes IRVE pour flottes entreprise   [*** PILOTE V0 ***]
# ════════════════════════════════════════════════════════════════
# Brouillon de cadrage V0 (24 mai 2026). Le schéma est validé en D1.
# C'EST LA VERTICALE DU RUN PILOTE (D5/D6) — cible réelle du client de
# l'utilisateur (intermédiaire). Se branche sur le module
# veille_immatriculations (flux VE flotte AAA).
# Référence : VERTICALES.md sections 4 et 8.
#
# Cible idéale décrite par le client :
#   "Entreprises de moyenne taille, dont on peut voir le CA annuel pour
#    s'assurer des ressources, qui viennent de se doter de véhicules
#    électriques et cherchent à installer des bornes de recharge."
#
# DÉPENDANCES À LEVER AVANT LE PILOTE (cf ROADMAP_V0 'État préparation'):
#   - CA annuel : NON disponible via data.gouv.fr gratuit (qui ne donne
#     que la tranche d'effectif). Nécessite une clé Pappers (payant), ou
#     on se rabat sur la tranche d'effectif comme proxy de ressources.
#   - Signal VE récent : nécessite un accès au flux d'immatriculations
#     VE par entreprise (AAA Data ou source équivalente). Sans lui, on
#     retombe sur des heuristiques NAF (transport/logistique), plus faible.

verticale:
  slug: irve-flottes-b2b
  nom: "Bornes IRVE — flottes entreprise"
  description: |
    Installateur IRVE démarchant des entreprises de moyenne taille qui
    électrifient leur flotte : sociétés dont les ressources sont
    confirmées (CA), avec immatriculations VE/VHR récentes, cherchant à
    s'équiper en bornes de recharge sur site.

cible:
  type: b2b
  detail: "Entreprises moyenne taille (ETI/PME), CA confirmé, flotte VE en croissance"

offre:
  produit: "Infrastructure de recharge VE sur site (bornes + supervision)"
  argument_principal: "Pilotage de la consommation de recharge et avantages fiscaux (suramortissement, prime ADVENIR) ; obligation LOM, TCO flotte et autonomie de recharge"
  ticket_moyen_eur: 60000

# Client signataire des mails L4 (signature au nom du client, pas de RénoBoost).
emetteur:
  nom_entreprise: "Rossini Energy"

cibles:
  secteurs_places:
    - type: "establishment"
      query: "société de transport"
    - type: "car_dealer"
      query: "concessionnaire automobile"
    - type: "establishment"
      query: "entreprise logistique"
    - type: "establishment"
      query: "société de services techniques"
  filtres_entreprise:
    effectif_min: 50          # "moyenne taille" — ETI/PME
    naf_inclus: ["49", "45", "53", "81", "43"]
    naf_exclus: []
    # Calibration : pas de filtre sur la forme (coops/SCA/SCI = cibles valides).
    forme_juridique_inclus: []
    multi_sites_only: false

signaux:
  # Le module veille_immatriculations alimente le signal #1 (flux VE flotte).
  - "Immatriculations VE/VHR récentes au nom de l'entreprise (données AAA)"
  - "CA annuel confirmé suffisant (ressources) — via Pappers, ou proxy effectif"
  - "Flotte > 10 véhicules"
  - "Parking/dépôt propre pour installer les bornes"
  - "Obligation LOM (flotte > 100 véhicules = quota VE)"

qualification:
  seuil_score_top: 70
  criteres_top:
    - "Signal immatriculation VE flotte présent (données AAA)"
    - "CA confirmé ou effectif >= 50 (ressources suffisantes)"
    - "Email décideur (DG, resp. flotte/moyens généraux) trouvé"
  criteres_exclusion:
    - "Pas de site propre pour installer"
    - "Activité sans flotte significative"
    - "Ressources insuffisantes (TPE)"

enrichissements:
  l3_5_dropcontact: true
  lecture_site_web: true
  detection_terrain: false   # V1

ton_mail:
  registre: "professionnel, orienté obligation + économies"
  longueur_mots: 120
  attaque: "Constat sur leur bascule de flotte vers l'électrique"
  cta: "15 min pour cadrer votre infrastructure de recharge"
  signaux_a_personnaliser:
    - "nom décideur (resp. flotte / DG)"
    - "ville"
    - "indice d'électrification observé"
    - "taille de flotte"

sequence:
  j0:
    template: "templates_sequence/mail_j0.md"
    sujet: "{nom_entreprise} — recharger votre flotte VE sur site ?"
  j3:
    template: "templates_sequence/mail_j3.md"
    sujet: "Relance — IRVE {ville}"
  j7:
    template: "templates_sequence/mail_j7.md"
    sujet: "Dernière relance — {nom_entreprise}"

budget_typique:
  volume_cible: 150
  cout_pipeline_eur: 12
  cout_avec_l3_5_eur: 35
