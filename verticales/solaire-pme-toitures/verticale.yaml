# ════════════════════════════════════════════════════════════════
# VERTICALE — Panneaux solaires PME (toitures industrielles)
# ════════════════════════════════════════════════════════════════
# Brouillon de cadrage V0 (24 mai 2026). Le schéma est validé en D1.
# Référence : VERTICALES.md sections 4 et 8.

verticale:
  slug: solaire-pme-toitures
  nom: "Panneaux solaires PME — toitures industrielles"
  description: |
    Installateur PV démarchant des PME industrielles et logistiques
    propriétaires de leur bâtiment, avec toiture > 200 m² exploitable.

# Cible : détermine les stratégies L1/L2/L3 via le dispatcher (cf section 8)
cible:
  type: b2b
  detail: "PME/ETI industrielles ou logistiques, propriétaires de leur bâtiment"

offre:
  produit: "Centrale PV en autoconsommation ou revente de surplus"
  argument_principal: "ROI 6-8 ans, autonomie énergétique, conformité CSRD"
  ticket_moyen_eur: 80000

cibles:
  secteurs_places:
    - type: "establishment"
      query: "usine agroalimentaire"
    - type: "establishment"
      query: "entrepôt logistique"
    - type: "establishment"
      query: "site industriel"
    - type: "establishment"
      query: "plateforme logistique"
  filtres_entreprise:
    effectif_min: 20
    naf_inclus: ["10", "11", "20", "22", "25", "28", "29", "52"]
    naf_exclus: ["56"]
    # Calibration (essai réel dépt 59) : pas de filtre sur la forme juridique.
    # [SAS,SARL,SA] évinçait coopératives (ex. Canelia, forme 5202) et SCI
    # propriétaires du bâtiment — cibles solaires valides. NAF + effectif suffisent.
    forme_juridique_inclus: []
    multi_sites_only: false

signaux:
  # Pilotent explicitement le scoring L4 (vente sur signal).
  # V0 = texte libre pour le prompt. V1 = calculés (Google Solar API, IGN).
  - "Bâtiment propriétaire (vs locataire)"
  - "Conso élec annuelle estimée > 100 MWh"
  - "Toiture vaste, plane, orientée S/SE/SO"
  - "Surface bâti > 500 m²"

qualification:
  seuil_score_top: 70
  criteres_top:
    - "Au moins 2 signaux présents sur 4"
    - "Effectif >= 20"
    - "Email décideur trouvé"
  criteres_exclusion:
    - "Locataire des locaux"
    - "Secteur hors cible NAF"

enrichissements:
  l3_5_dropcontact: true
  lecture_site_web: true
  detection_terrain: false   # V1

ton_mail:
  registre: "professionnel direct"
  longueur_mots: 120
  attaque: "Constat sur leur conso élec ou la surface de leur toiture"
  cta: "15 min en visio pour un pré-audit toiture gratuit"
  signaux_a_personnaliser:
    - "nom dirigeant"
    - "ville"
    - "secteur précis"
    - "signal lu sur leur site web"

sequence:
  j0:
    template: "templates_sequence/mail_j0.md"
    sujet: "{prenom}, votre toiture à {ville} produit-elle déjà ?"
  j3:
    template: "templates_sequence/mail_j3.md"
    sujet: "Relance — {nom_entreprise}"
  j7:
    template: "templates_sequence/mail_j7.md"
    sujet: "Dernière relance — {nom_entreprise}"

budget_typique:
  volume_cible: 200
  cout_pipeline_eur: 15     # L1+L2+L3+L4 Haiku
  cout_avec_l3_5_eur: 45    # + Dropcontact
