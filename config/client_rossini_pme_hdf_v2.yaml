# ════════════════════════════════════════════════════════════════
# Rossini — pilote PME Hauts-de-France v2 (SIRENE-first)
# Cible : PME locales 5-50 salariés, CA 500k-5M, axe flotte/transport
# Zone : 59, 62, 80, 02, 60
# ════════════════════════════════════════════════════════════════
#
# Différences vs v1 (client_rossini_pme_hdf.yaml) :
#
# 1. Pipeline SIRENE-first : on découvre via recherche-entreprises.api.gouv
#    (gratuite, filtres natifs CA/effectif/NAF/zone) puis enrichissement
#    Places ciblé par nom+ville. Inverse l'ordre d'attaque de la v1 qui
#    perdait 47/50 leads en hors-filtre.
#    → lancer avec `--stages 0,1,3,4` (ou 0,3,4 sans Places).
#
# 2. NAF en codes EXACTS (pas en préfixes) — exigence de l'API recherche-
#    entreprises. Ici on cible l'axe transport/location pour le MVP. Pour
#    élargir à l'industrie, ajouter les codes 10.xx, 25.xx, etc.
#
# 3. categorie_entreprise: ["PME"] = filtre INSEE natif côté API,
#    plus précis que les seuls filtres CA/effectif.
# ════════════════════════════════════════════════════════════════

run:
  client_name: "rossini-pme-hdf-v2"
  description: "Pilote 50 leads — PME Hauts-de-France via SIRENE-first, axe flotte/transport (offre ombrières + IRVE)"
  campaign_date: "2026-05-28"

stages:
  enable_stage_1_decouverte: true        # Places en mode enrichissement (--stages 0,1,3,4)
  enable_stage_2_entreprises: true       # skippé automatiquement si stage 0 actif
  enable_stage_3_contacts: true
  enable_stage_4_prospection: true

# Secteurs : restent renseignés pour rester compatible avec le schéma config,
# mais NON utilisés en mode SIRENE-first (le YAML les ignore côté stage 0).
# Le ciblage métier passe par filtres_entreprise.naf_inclus ci-dessous.
secteurs:
  - {type: "flotte_transport", query: "transport routier"}
  - {type: "flotte_location",  query: "location véhicules entreprise"}

zone:
  type: "departement"
  codes: ["59", "62", "80", "02", "60"]
  rayon_par_point_km: 12          # utilisé par enrichissement Places (stage 1)
  pas_grille_km: 15

filtres:
  statut_requis: "OPERATIONAL"
  note_min: null
  nb_avis_min: null
  nb_avis_max: null
  exiger_telephone: false
  exiger_site_web: false           # ⚠ false en SIRENE-first : Places peut ne pas matcher
  dedup_chaines: false

# Filtres entreprise — appliqués nativement par l'API recherche-entreprises
# (économise des appels Places sur des leads voués au rejet).
filtres_entreprise:
  effectif_min: 5
  effectif_max: 50
  ca_min: 500000
  ca_max: 5000000
  categorie_entreprise_inclus: ["PME"]
  # NAF en codes EXACTS. Cible flotte/transport pour le MVP.
  # Élargir ici si on veut couvrir industrie alimentaire, métallurgie, etc.
  naf_inclus:
    - "49.41A"       # transports routiers de fret interurbains
    - "49.41B"       # transports routiers de fret de proximité
    - "49.41C"       # location de camions avec chauffeur
    - "49.42Z"       # services de déménagement
    - "77.11A"       # location courte durée VP et VUL
    - "77.11B"       # location longue durée VP et VUL
    - "77.12Z"       # location et location-bail de camions

volume:
  cible: 50
  max_par_secteur: null            # non utilisé en SIRENE-first

budget:
  max_eur: 15                      # plafond Places (enrichissement) + L4 Claude

sortie:
  format: ["csv"]
  langue: "fr"
