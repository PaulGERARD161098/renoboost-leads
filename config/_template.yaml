# ════════════════════════════════════════════════════════════════
# Template de configuration RénoBoost Leads
# ════════════════════════════════════════════════════════════════
# Copier ce fichier et adapter pour chaque nouveau client :
#   cp config/_template.yaml config/<nom_client>.yaml
# ════════════════════════════════════════════════════════════════

# ─── Identification du run ────────────────────────────────────────
run:
  client_name: "exemple-client"           # Nom court (utilisé dans nom de fichier)
  description: "Description du client et besoin"
  campaign_date: "2026-05-01"

# ─── Étages activés ───────────────────────────────────────────────
stages:
  enable_stage_1_decouverte: true         # Google Places — toujours
  enable_stage_2_entreprises: false       # Pappers — activer après ajout clé .env
  enable_stage_3_contacts: false          # Dropcontact — idem
  enable_stage_4_prospection: false       # Claude — idem

# ─── Cibles : Secteurs (catégories Google Places) ─────────────────
# Voir liste complète : https://developers.google.com/maps/documentation/places/web-service/place-types
secteurs:
  # Format : (type Places officiel, query texte qui sera utilisée si Text Search)
  - type: "restaurant"
    query: "restaurant"
  - type: "lodging"
    query: "hôtel"

# ─── Cibles : Zone géographique ───────────────────────────────────
zone:
  type: "departement"                     # "ville" | "departement" | "region" | "france"
  codes: ["34"]                           # Liste de codes (INSEE pour dept, codes postaux pour ville)
  rayon_par_point_km: 10                  # Rayon de recherche autour de chaque point de la grille
  pas_grille_km: 15                       # Espacement entre points de la grille

# ─── Filtres qualité (optionnels) ─────────────────────────────────
filtres:
  statut_requis: "OPERATIONAL"            # OPERATIONAL | CLOSED_TEMPORARILY | tout
  note_min: null                          # ex: 3.5 ou null
  nb_avis_min: null                       # ex: 10 ou null
  nb_avis_max: null                       # ex: 500 ou null
  exiger_telephone: false
  exiger_site_web: false
  dedup_chaines: false                    # true = 1 seul Carrefour par enseigne

# ─── Filtres entreprise (optionnels, appliqués après L2) ─────────
# Les leads qui ne passent pas sont FLAGUÉS (pas rejetés) et exportés
# dans un CSV séparé `etage3_contacts_hors_filtre.csv`. L3 (scraping)
# tourne sur tous les leads pour conserver l'info contact.
filtres_entreprise:
  effectif_min: null                      # ex: 50 (user-friendly, nb salariés)
  effectif_max: null                      # ex: 5000 ou null
  tranche_effectif_inclus: []             # codes INSEE bruts ex ["21","22","31"] — prioritaire si fourni
  naf_inclus: []                          # préfixes libres ex ["25","28"] (matche "25.62A") ou code exact ex ["25.62A"]
  naf_exclus: []                          # ex ["56"] (restauration)
  forme_juridique_inclus: []              # labels ou codes ex ["SAS","SARL"] ou ["5710","5499"]
  forme_juridique_exclus: []              # ex ["EI","EIRL"]
  multi_sites_only: false                 # true = exige nb_etablissements > 1

# ─── Volume cible ─────────────────────────────────────────────────
volume:
  cible: 200                              # Nombre de leads visés
  max_par_secteur: null                   # Limiter par secteur (null = pas de limite)

# ─── Budget ───────────────────────────────────────────────────────
budget:
  max_eur: 30                             # Plafond € pour le run (stop auto)

# ─── Sortie ───────────────────────────────────────────────────────
sortie:
  format: ["csv"]                         # csv | json | html
  langue: "fr"                            # fr | en
